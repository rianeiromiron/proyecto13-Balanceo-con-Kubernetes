# Permisos mínimos, namespaced (NO ClusterRole): el generador solo puede
# leer/escalar el Deployment "backend" y listar pods, únicamente dentro de
# este namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: generator-sa
  namespace: loadbalancer-k8s
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: generator-role
  namespace: loadbalancer-k8s
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: generator-rolebinding
  namespace: loadbalancer-k8s
subjects:
  - kind: ServiceAccount
    name: generator-sa
    namespace: loadbalancer-k8s
roleRef:
  kind: Role
  name: generator-role
  apiGroup: rbac.authorization.k8s.io
